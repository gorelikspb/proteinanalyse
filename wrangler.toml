# Cloudflare Pages project: static HTML in public/ plus optional /api/* Functions.
#
# Do not set `main` here. The previous Worker entry
#   name = "proteinanalyse-api"
#   main = "functions/api/analyze.js"
# made every request (including GET /) hit a Pages-style `onRequest` module
# with no Worker `fetch` handler, which returns HTTP 500 on
# proteinanalyse.pages.dev when the project is treated as a Worker.
name = "proteinanalyse"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

[vars]
API_VERSION = "1.0.0"
